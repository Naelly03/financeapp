version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: financeapp_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-financeapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-financeapp123}
      POSTGRES_DB: ${POSTGRES_DB:-financeapp_dev}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U financeapp']
      interval: 10s
      timeout: 5s
      retries: 5

  postgres_test:
    image: postgres:16-alpine
    container_name: financeapp_db_test
    restart: unless-stopped
    environment:
      POSTGRES_USER: financeapp
      POSTGRES_PASSWORD: financeapp123
      POSTGRES_DB: financeapp_test
    ports:
      - '5434:5432'

volumes:
  postgres_data:
